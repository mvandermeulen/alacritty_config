# NUMBER KEYS {{{

# Number Row: Backtick, Minus, Equals, Delete {{{
########################
[[keyboard.bindings]]
chars = "\u001B[96;5u"
key = "`"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001B[45;5u"
key = "Minus"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001B[61;5u"
