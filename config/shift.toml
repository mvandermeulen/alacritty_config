# OTHER KEYS {{{
###########################
[[keyboard.bindings]]
chars = "\u001b[127;2u"
key = "Back"
mods = "Shift"

# This key code is confirmed here: https://powerusers.codidact.com/posts/291531
[[keyboard.bindings]]
