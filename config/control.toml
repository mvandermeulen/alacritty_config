# vim: set filetype=tmux fdm=marker foldenable foldlevel=4 nospell:
# File:          config/control.toml
# Author:        Mark van der Meulen <mark@vdm.id.au>
# Description:   Control key bindings for Alacritty
# Last Modified: 2025-08-06


#######################################################################
# ⌃ Control Key {{{
#######################################################################

# ⌃ Pure Bindings (No Modifiers) {{{
################################################

# NUMBER KEYS {{{

# Number Row: Backtick, Minus, Equals, Backspace {{{
########################
[[keyboard.bindings]]
chars = "\u001B[96;5u"
key = "`"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001B[45;5u"
key = "Minus"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001B[61;5u"
key = "Equals"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001b[127;5u"
key = "Back"
mods = "Control"


# }}}

# }}}

# ARROW KEYS {{{
###########################

[[keyboard.bindings]]
chars = "\u001B[1;5B"
key = "Down"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001B[1;5A"
key = "Up"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001B[1;5C"
key = "Right"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001B[1;5D"
key = "Left"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001B[6;5~"
key = "PageDown"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001B[5;5~"
key = "PageUp"
mods = "Control"

# }}}

# REGULAR KEYS {{{
###########################

# A-Z {{{
########################

[[keyboard.bindings]]
chars = "\u001b[105;5u"
key = "I"
mods = "Control"

# Added 2026-03-28 from jceb
# [[keyboard.bindings]]
# chars = "\u001B[106;5u"
# key = "J"
# mods = "Control"

[[keyboard.bindings]]
chars = "\u001b[109;5u"
key = "M"
mods = "Control"




# }}}

# Bottom Row: Comma, Period, Slash {{{
########################
[[keyboard.bindings]]
chars = "\u001b[44;5u"
# chars = "\u001B[33~"
key = "Comma"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001B[46;5u"
key = "Period"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001B[47;5u"
key = "Slash"
mods = "Control"

# }}}

# Home Row: Semicolon, Quotes, Return {{{
########################
[[keyboard.bindings]]
chars = "\u001B[59;5u"
key = "Semicolon"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001B[39;5u"
key = "'"
mods = "Control"

# # chars = "\x1b[74;5u"
# # chars = "^[[13;5u"
# # chars = "\x1b\x5b\x32\x35\x7e"
# This key code is confirmed here: https://powerusers.codidact.com/posts/291531
[[keyboard.bindings]]
chars = "\u001b[13;5u"
key = "Return"
mods = "Control"

# [[keyboard.bindings]]
# chars = "\x1b\x5b\x32\x35\x7e"
# key = "Return"
# mods = "Control"


# }}}

# Home Row + 1: Brackets, Backslash {{{
########################
[[keyboard.bindings]]
chars = "\u001b[91;5u"
key = "LBracket"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001b[93;5u"
key = "RBracket"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001B[92;5u"
key = "Backslash"
mods = "Control"

# }}}

# }}}

