#######################################################################
# ⌥ Option Key {{{
#######################################################################

# ⌥ + ⇧ Shift Key Modifier {{{
################################################

# NUMBER KEYS {{{

# Number Row: Backtick, Minus, Equals, Backspace {{{
########################
[[keyboard.bindings]]
chars = "\u001b[127;4u"
key = "Back"
mods = "Alt|Shift"


# }}}


[[keyboard.bindings]]
chars = "\u001B!"
key = "Key1"
mods = "Alt|Shift"

[[keyboard.bindings]]
chars = "\u001B@"
key = "Key2"
mods = "Alt|Shift"

[[keyboard.bindings]]
