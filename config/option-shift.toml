mods = "Alt|Shift"

[[keyboard.bindings]]
chars = "\u001B+"
key = "Equals"
mods = "Alt|Shift"

[[keyboard.bindings]]
chars = "\u001b[127;4u"
key = "Back"
mods = "Alt|Shift"

# }}}

