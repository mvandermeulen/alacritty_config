# ⌃ Control Key {{{
#######################################################################

# ⌃ + ⌥ Option Key Modifier {{{

###########################
# NUMBER KEYS {{{
###########################

# Number Row: Backtick, Minus, Equals, Backspace {{{
########################
[[keyboard.bindings]]
chars = "\u001b[127;7u"
key = "Back"
mods = "Control|Alt"


# }}}



# }}}

